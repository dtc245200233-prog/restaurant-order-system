services:
  web:
    build: ./app
    container_name: restaurant-web
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://restaurant_app:${DB_APP_PASSWORD}@db:5432/restaurant_db"
      SECRET_KEY: ${SECRET_KEY}
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    ports:
      - "5000:5000"
    security_opt:
      - no-new-privileges:true
 
  nginx:
    image: nginx:alpine
    container_name: restaurant-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16
    container_name: restaurant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: restaurant_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ./db/init.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_admin -d restaurant_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
      - dbadmin
    security_opt:
      - no-new-privileges:true

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: restaurant-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dbadmin
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: restaurant-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.6.0
    container_name: restaurant-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  loki:
    image: grafana/loki:3.4.0
    container_name: restaurant-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  promtail:
    image: grafana/promtail:3.4.0
    container_name: restaurant-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/tmp
    depends_on:
      - loki
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
networks:
  frontend:
  backend:
    internal: true
  dbadmin:
  monitoring:

volumes:
  postgres_data:
  grafana_data:
  loki_data:
  promtail_positions:
